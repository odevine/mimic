name: Release Please

# release-please watches main for conventional commits and keeps a release pull
# request open per package. Merging that pull request tags the release and
# publishes it. A ui release then gets its installers built below. The engine
# is a Go module, so its release is the tag alone
on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      engine-released: ${{ steps.release.outputs['engine--release_created'] }}
      engine-tag: ${{ steps.release.outputs['engine--tag_name'] }}
      ui-released: ${{ steps.release.outputs['ui--release_created'] }}
      ui-tag: ${{ steps.release.outputs['ui--tag_name'] }}
    steps:
      # A personal access token rather than GITHUB_TOKEN, so the release pull
      # request and the tag it pushes still trigger CI
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          token: ${{ secrets.MIMIC_RELEASE_PLEASE_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # The app builds natively on each operating system and attaches its installers
  # and update files, with a SHA256SUMS covering them, to the release
  # release-please just created. package-ui.yml does the work, and is also run on
  # its own to exercise the packaging before a release depends on it
  ui-packages:
    needs: release-please
    if: needs.release-please.outputs.ui-released == 'true'
    permissions:
      contents: write
    uses: ./.github/workflows/package-ui.yml
    with:
      tag: ${{ needs.release-please.outputs.ui-tag }}
      publish: true
    secrets: inherit

  # GitHub marks each new release as latest, so an engine release would take the
  # badge from the app. This hands it back to the newest ui release after either
  # package releases, and waits for ui-packages so the badge lands on a release
  # that already has its downloads
  pin-latest:
    needs: [release-please, ui-packages]
    if: >-
      !cancelled() && needs.ui-packages.result != 'failure' &&
      (needs.release-please.outputs.engine-released == 'true' ||
       needs.release-please.outputs.ui-released == 'true')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Mark the newest ui release as latest
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          tag="$(gh release list --limit 100 --exclude-drafts --exclude-pre-releases \
            --json tagName,createdAt \
            --jq '[.[] | select(.tagName | startswith("ui/"))] | sort_by(.createdAt) | last | .tagName')"
          if [ -z "$tag" ] || [ "$tag" = "null" ]; then
            echo "no ui release to mark as latest"
            exit 0
          fi
          echo "marking ${tag} as latest"
          gh release edit "$tag" --latest

  # ui pins the engine in its go.mod, so an engine release opens a pull request
  # moving the pin to the new tag. A newer engine release closes the pull request
  # it supersedes. mimic-templates moves its pin by hand, only when a release
  # changes the manifest shape, since the pin sets every bundle's minEngine
  bump-engine:
    needs: release-please
    if: needs.release-please.outputs.engine-released == 'true'
    runs-on: ubuntu-latest
    steps:
      # A personal access token rather than GITHUB_TOKEN, so the pull request it
      # opens still triggers CI
      - uses: actions/checkout@v7
        with:
          ref: main
          token: ${{ secrets.MIMIC_RELEASE_PLEASE_TOKEN }}

      - uses: actions/setup-go@v7
        with:
          go-version-file: ui/go.mod
          cache-dependency-path: ui/go.sum

      - name: Open a pull request moving the engine pin
        working-directory: ui
        env:
          GH_TOKEN: ${{ secrets.MIMIC_RELEASE_PLEASE_TOKEN }}
          GOWORK: "off"
          TAG: ${{ needs.release-please.outputs.engine-tag }}
        run: |
          version="${TAG#engine/}"
          module=github.com/odevine/mimic/engine
          current="$(go list -m -f '{{.Version}}' "$module")"
          if [ "$current" = "$version" ]; then
            echo "already on ${module} ${version}"
            exit 0
          fi

          # The module proxy fetches a new tag on first request, which can lag
          # the release by a few seconds
          for attempt in 1 2 3 4 5; do
            go get "${module}@${version}" && break
            [ "$attempt" = 5 ] && exit 1
            sleep 20
          done
          go mod tidy

          branch="deps/engine-${version}"
          title="build(ui): depend on the released engine ${version}"
          git config user.name github-actions
          git config user.email github-actions@github.com
          git switch -c "$branch"
          git add go.mod go.sum
          git commit -m "$title"
          git push --force origin "$branch"

          pr="$(gh pr list --head "$branch" --state open --json url --jq '.[0].url')"
          if [ -z "$pr" ]; then
            pr="$(gh pr create --base main --head "$branch" --title "$title" \
              --body "Moves the engine pin from ${current} to ${version}, released as ${TAG}.")"
          fi
          echo "pull request: ${pr}"

          for stale in $(gh pr list --state open --json number,headRefName \
            --jq ".[] | select(.headRefName | startswith(\"deps/engine-\")) | select(.headRefName != \"${branch}\") | .number"); do
            gh pr close "$stale" --delete-branch --comment "Superseded by ${pr}"
          done
