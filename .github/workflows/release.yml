name: Release

# The engine is a subdirectory module, so its version tags carry the module
# path: engine/v0.1.0, engine/v0.1.1, and so on. That prefix is what lets
# `go get github.com/odevine/mimic/engine@v0.1.0` resolve the tag.
on:
  push:
    tags:
      - "engine/v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: engine/go.mod
          cache-dependency-path: engine/go.sum

      - name: Test
        working-directory: engine
        run: go test ./...

      - name: Derive version
        id: version
        run: echo "value=${GITHUB_REF_NAME#engine/}" >> "$GITHUB_OUTPUT"

      - name: Build rendercard binaries
        working-directory: engine
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          mkdir -p "${GITHUB_WORKSPACE}/dist"
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64; do
            os="${target%/*}"
            arch="${target#*/}"
            ext=""
            [ "$os" = "windows" ] && ext=".exe"
            out="rendercard-${VERSION}-${os}-${arch}${ext}"
            echo "building ${out}"
            GOOS="$os" GOARCH="$arch" CGO_ENABLED=0 go build \
              -trimpath -ldflags "-s -w" \
              -o "${GITHUB_WORKSPACE}/dist/${out}" ./cmd/rendercard
          done

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            "${GITHUB_WORKSPACE}"/dist/*
