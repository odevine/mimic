name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: engine
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: engine/go.mod
          cache-dependency-path: engine/go.sum

      - name: Check formatting
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt:"
            echo "$unformatted"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      # render runs on one goroutine and hands its pixel work to impasto, where
      # the race detector multiplies the cost many times over. The ui job's race
      # run still covers render and impasto, since it instruments every package
      # ui builds
      - name: Test
        run: |
          go test ./render
          go test -race $(go list ./... | grep -v '/render$')

  # ui-core is everything in ui except the window: the services, the workspace
  # and their tests. It builds and tests without cgo, so it runs on one Linux
  # runner and cross-compiles to every target
  ui-core:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    # ui depends on engine's go.mod pin, not whatever a go.work happens to
    # union locally, so CI builds the same hermetic dependency graph a real
    # release does rather than coupling ui's CI to every unreleased engine change
    env:
      GOWORK: "off"
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: ui/go.mod
          cache-dependency-path: ui/go.sum

      - name: Check formatting
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt:"
            echo "$unformatted"
            exit 1
          fi

      # The window package and the main package that imports it need a C
      # toolchain and the webview's libraries, so they are built by ui-desktop
      - name: List the core packages
        run: go list ./... | grep -v -e '/internal/desktop$' -e '/mimic/ui$' > "$RUNNER_TEMP/core.txt"

      - name: Vet
        run: go vet $(cat "$RUNNER_TEMP/core.txt")

      - name: Test
        run: go test -race $(cat "$RUNNER_TEMP/core.txt")

      # The frontend has no build step, so its tests run on Node as it is, with
      # the Wails runtime and the document stubbed
      - name: Test the frontend
        run: node --test frontend/test/*.test.mjs

      - name: Cross-compile the core for all targets
        run: |
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64 windows/arm64; do
            os="${target%/*}"
            arch="${target#*/}"
            echo "building ${os}/${arch}"
            GOOS="$os" GOARCH="$arch" CGO_ENABLED=0 go build $(cat "$RUNNER_TEMP/core.txt")
          done

      # Only internal/desktop may depend on Wails, which is what keeps the rest
      # buildable and testable without cgo
      - name: Check that only the window package imports Wails
        run: |
          status=0
          for pkg in $(cat "$RUNNER_TEMP/core.txt"); do
            if go list -deps "$pkg" | grep -q 'github.com/wailsapp/wails'; then
              echo "$pkg depends on Wails"
              status=1
            fi
          done
          exit $status

  # ui-e2e drives the page in headless Chromium and WebKit, with no window and no
  # input control. The app is built with the server tag, which has no native
  # window and needs neither cgo nor GTK, and it runs beside a fake Scryfall,
  # GitHub and template catalog, so a run touches no network. The page tests need
  # no server at all and run in the same pass, along with the accessibility scan
  # and the screenshot comparison, which compares against baselines made on this
  # runner (see update-visual-baselines.yml). A failure leaves the report and the
  # traces behind, with the images that differed
  ui-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: ui/e2e
    env:
      GOWORK: "off"
      CGO_ENABLED: "0"
      CI: "true"
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: ui/go.mod
          cache-dependency-path: ui/go.sum

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/e2e/package-lock.json

      - name: Install the test dependencies
        run: npm ci

      # The browsers are downloaded once per version of Playwright, and the
      # operating system libraries they need are installed on every run
      - name: Cache the browsers
        id: browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('ui/e2e/package-lock.json') }}

      - name: Install the browsers
        if: steps.browsers.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium webkit

      - name: Install the browsers' system libraries
        if: steps.browsers.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium webkit

      - name: Test
        run: npx playwright test

      - name: Keep the report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-report
          path: |
            ui/e2e/report
            ui/e2e/test-results
            ui/e2e/.scratch/*.log
          retention-days: 14

  # ui-desktop builds the app itself on each operating system, since the webview
  # needs the platform's own toolchain and libraries, and then starts it with
  # --smoke to prove the window, the bridge, the image routes and a few scripted
  # flows work in the platform's own webview
  ui-desktop:
    name: ui-desktop (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
        working-directory: ui
    env:
      GOWORK: "off"
      # Wails v3 builds against GTK 4 on Linux unless told otherwise, and Ubuntu
      # 22.04 ships GTK 3 and WebKitGTK 4.1
      TAGS: ${{ startsWith(matrix.os, 'ubuntu') && 'gtk3' || '' }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: ui/go.mod
          cache-dependency-path: ui/go.sum

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev xvfb

      - name: Vet
        run: go vet -tags "$TAGS" ./internal/desktop .

      - name: Test the window package
        run: go test ${{ runner.os != 'Windows' && '-race' || '' }} -tags "$TAGS" ./internal/desktop

      - name: Build
        run: go build -tags "$TAGS" -o "mimic${{ runner.os == 'Windows' && '.exe' || '' }}" .

      - name: Launch check
        run: |
          if [ "$RUNNER_OS" = Linux ]; then
            timeout 120 dbus-run-session -- xvfb-run -a ./mimic -smoke
          elif [ "$RUNNER_OS" = Windows ]; then
            ./mimic.exe -smoke
          else
            ./mimic -smoke
          fi
