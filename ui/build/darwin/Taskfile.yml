version: '3'

# macOS builds need cgo for the webview, so they run on a Mac. The release is a
# universal binary, one build per architecture joined with lipo, in an app
# bundle that is ad-hoc signed, which gives it a valid signature structure but is
# not notarized. A Developer ID signing step is guarded by its secrets and
# does nothing without them, so adding them later needs no change here

tasks:
  build:
    summary: Builds one architecture, ARCH defaulting to this machine's
    env:
      GOOS: darwin
      CGO_ENABLED: 1
      GOARCH: '{{.ARCH | default ARCH}}'
      CGO_CFLAGS: "-mmacosx-version-min=12.0"
      CGO_LDFLAGS: "-mmacosx-version-min=12.0"
      MACOSX_DEPLOYMENT_TARGET: "12.0"
    cmds:
      - go build -tags production -trimpath -buildvcs=false -ldflags="{{.LDFLAGS}}" -o "{{.OUTPUT | default (printf "%s/%s" .BIN_DIR .APP_NAME)}}" .

  build:universal:
    summary: Builds both architectures and joins them
    deps:
      - task: build
        vars: {ARCH: amd64, OUTPUT: '{{.BIN_DIR}}/{{.APP_NAME}}-amd64'}
      - task: build
        vars: {ARCH: arm64, OUTPUT: '{{.BIN_DIR}}/{{.APP_NAME}}-arm64'}
    cmds:
      - lipo -create -output "{{.BIN_DIR}}/{{.APP_NAME}}" "{{.BIN_DIR}}/{{.APP_NAME}}-amd64" "{{.BIN_DIR}}/{{.APP_NAME}}-arm64"
      - rm "{{.BIN_DIR}}/{{.APP_NAME}}-amd64" "{{.BIN_DIR}}/{{.APP_NAME}}-arm64"

  bundle:
    summary: Wraps the binary in Mimic.app and signs it ad hoc
    cmds:
      - rm -rf "{{.BIN_DIR}}/{{.PRODUCT}}.app"
      - mkdir -p "{{.BIN_DIR}}/{{.PRODUCT}}.app/Contents/MacOS" "{{.BIN_DIR}}/{{.PRODUCT}}.app/Contents/Resources"
      - cp build/darwin/icons.icns "{{.BIN_DIR}}/{{.PRODUCT}}.app/Contents/Resources/"
      - cp "{{.BIN_DIR}}/{{.APP_NAME}}" "{{.BIN_DIR}}/{{.PRODUCT}}.app/Contents/MacOS/"
      - cp build/darwin/Info.plist "{{.BIN_DIR}}/{{.PRODUCT}}.app/Contents/"
      - xattr -cr "{{.BIN_DIR}}/{{.PRODUCT}}.app"
      - codesign --force --deep --sign - "{{.BIN_DIR}}/{{.PRODUCT}}.app"
      - codesign --verify --deep --strict "{{.BIN_DIR}}/{{.PRODUCT}}.app"

  package:
    summary: Makes the dmg for a fresh install and the zip the updater swaps in
    deps: [build:universal]
    cmds:
      - task: bundle
      - go run ./cmd/pkgtool zip -out "{{.BIN_DIR}}/{{.PRODUCT}}-{{.VERSION}}-macos-universal.zip" "{{.BIN_DIR}}/{{.PRODUCT}}.app"
      - >-
        go tool wails3 tool package --format dmg --name "{{.PRODUCT}}" --out "{{.BIN_DIR}}"
        --background build/dmg-background.png --volume-icon build/darwin/icons.icns
        --file-icon build/darwin/icons.icns
      - mv "{{.BIN_DIR}}/{{.PRODUCT}}.dmg" "{{.BIN_DIR}}/{{.PRODUCT}}-{{.VERSION}}-macos-universal.dmg"
